server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # Las paginas se revisan en cada visita; el resto se cachea una semana.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }
    location ~* \.(css|png|mp4)$ {
        add_header Cache-Control "public, max-age=604800";
    }

    # El instalador siempre se descarga, nunca se abre en el navegador. Sin
    # gzip, para que llegue el Content-Length que usa la barra de progreso.
    location /dist/ {
        gzip off;
        add_header Content-Disposition "attachment";
        add_header Cache-Control "no-cache";
    }

    # Comentarios y correos: los guarda el contenedor api, que solo esta en la
    # red interna. Nombre unico (nunca "api" a secas: guia 2.3) y resuelto en
    # cada peticion, para no fijar la IP de otro contenedor al arrancar.
    location /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $api_upstream http://voxel-world-api:8000;
        proxy_pass $api_upstream;
        client_max_body_size 16k;
        proxy_set_header Host $host;
    }

    location ~ /\. {
        deny all;
    }
}
